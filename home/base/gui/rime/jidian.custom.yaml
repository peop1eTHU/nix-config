# Personal Rime customisation for the 86 jidian wubi schemas (极点五笔), layered
# on top of the shared rime-data by Rime's <schema>.custom.yaml mechanism. The
# same file is deployed as wubi86_jidian_pinyin.custom.yaml and
# wubi86_jidian.custom.yaml; see README.md. Ported from flypy.custom.yaml.
patch:
  # Right Shift switches CN/EN; left Shift stays a plain modifier. Ctrl+Space
  # also switches (fcitx5 on Linux; the system input-source shortcut on macOS).
  ascii_composer/switch_key/Shift_L: noop
  ascii_composer/switch_key/Shift_R: commit_code

  # Disable the stock `Shift+space -> toggle full_shape` binding imported from
  # `default`; a schema-level `bindings/+` is appended last and wins.
  key_binder/bindings/+:
    - { when: always, accept: "Shift+space", unset_option: full_shape }

  # Prefer corner brackets over the upstream `【】｛｝` for [ ] { }.
  "punctuator/full_shape/[":
    - 「
    - 【
    - 〔
    - ［
  "punctuator/full_shape/]":
    - 」
    - 】
    - 〕
    - ］
  "punctuator/full_shape/{":
    - 『
    - 〖
    - ｛
  "punctuator/full_shape/}":
    - 』
    - 〗
    - ｝
  "punctuator/half_shape/[":
    - 「
    - 【
    - 〔
    - ［
  "punctuator/half_shape/]":
    - 」
    - 】
    - 〕
    - ］
  "punctuator/half_shape/{":
    - 『
    - 〖
    - ｛
  "punctuator/half_shape/}":
    - 』
    - 〗
    - ｝
