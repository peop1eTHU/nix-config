- Homelab Monitoring:
    - Grafana:
        icon: grafana.svg
        href: https://grafana.homelab.example
        description: Data visualised on dashboards
        siteMonitor: https://grafana.homelab.example
    - VictoriaMetrics:
        icon: si-victoriametrics
        href: https://prometheus.homelab.example
        description: Time-series database
        siteMonitor: https://prometheus.homelab.example
    - Uptime Kuma:
        icon: uptime-kuma.svg
        href: https://uptime-kuma.homelab.example
        description: Uptime Checking
        siteMonitor: https://uptime-kuma.homelab.example
    - Alertmanager:
        icon: alertmanager.png
        href: https://alertmanager.homelab.example
        description: Alert routing
        siteMonitor: https://alertmanager.homelab.example
    - vmalert:
        icon: si-victoriametrics
        href: https://vmalert.homelab.example
        description: Alerting rules for VictoriaMetrics
        siteMonitor: https://vmalert.homelab.example

- Homelab Applications:
    - SFTPGO:
        icon: sftpgo.png
        href: "https://sftpgo.homelab.example/web/admin/folders"
        description: WebDAV & SFTP server
        siteMonitor: https://sftpgo.homelab.example/
    - Gitea:
        icon: gitea.png
        href: "https://git.homelab.example/"
        description: Gitea - Git with a cup of tea
        siteMonitor: "https://git.homelab.example/"
    - Transmission:
        icon: transmission.png
        href: "https://transmission.homelab.example/"
        description: Transmission BitTorrent client
        # No siteMonitor: the RPC requires auth, so the probe returns 401 and
        # every hit counts against transmission's anti-brute-force threshold.
    - Immich:
        icon: immich.png
        href: "https://immich.homelab.example/"
        description: Self-hosted photo library
        siteMonitor: "https://immich.homelab.example/"
    - Jellyfin:
        icon: jellyfin.png
        href: "https://jellyfin.homelab.example/"
        description: Media server
        siteMonitor: "https://jellyfin.homelab.example/"
    - RustFS Console:
        icon: mdi-database
        href: "https://s3-console.homelab.example/"
        description: S3-compatible object storage (RustFS)
        siteMonitor: "https://s3-console.homelab.example/"
    - Files:
        icon: mdi-folder-image
        href: "https://file.homelab.example/"
        description: Static file server
        siteMonitor: "https://file.homelab.example/"
- k3s-test-1:
